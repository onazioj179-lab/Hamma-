[package]
name = "spk-wasm"
version = "1.0.0"
edition = "2021"
authors = ["Singularity Pack Contributors"]
description = "WebAssembly bindings for Singularity Pack"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Blob",
    "File",
    "FileReader",
    "ReadableStream",
    "WritableStream",
    "TransformStream",
] }

# Serialization for JS
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Core library
spk-core = { path = "../core", default-features = false, features = ["zstd-codec", "lz4-codec", "brotli-codec", "rand"] }

# Error handling
console_error_panic_hook = { version = "0.1", optional = true }
thiserror = "1.0"

# Async
futures = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
