name: SHANTE native kernel
on:
  pull_request:
    paths: ['native/**', '!native/**/*.md', 'processor/**', 'scripts/*shante*', 'web/**', 'package.json', 'package-lock.json', '.github/workflows/shante-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/audit-shante.py
  provider-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install optional authentication runtime
        run: |
          python3 -m venv .venv-oauth
          .venv-oauth/bin/python -m pip install -r processor/requirements-oauth.txt
      - name: Verify provider authentication with local signing fixtures
        run: |
          .venv-oauth/bin/python -c "from processor.oauth import jwt; assert jwt is not None"
          .venv-oauth/bin/python -m unittest discover -s processor/tests -p test_oauth.py -v
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build and test Windows
        if: runner.os == 'Windows'
        run: ./scripts/build-shante.ps1 -Generator "Visual Studio 17 2022"
      - run: cmake --build native/build --config Release --parallel 2
        if: runner.os != 'Windows'
      - run: ctest --test-dir native/build -C Release --output-on-failure
        if: runner.os != 'Windows'
      - name: Processor integration (Unix)
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s processor/tests -v
      - name: Processor integration (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SHANTE_CORE_BINARY = "$PWD/native/build/Release/shante-core.exe"
          python -m unittest discover -s processor/tests -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package and smoke-test the workspace (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/package-shante.py --workspace
      - name: Package and smoke-test the workspace (Windows)
        if: runner.os == 'Windows'
        run: python scripts/package-shante.py --workspace
      - name: Check packaging repeatability from the same build
        if: runner.os == 'Linux'
        run: |
          python3 scripts/package-shante.py --workspace --output-dir "$RUNNER_TEMP/shante-repeat"
          cmp dist/SHANTE-Workspace-*.zip "$RUNNER_TEMP"/shante-repeat/SHANTE-Workspace-*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shante-workspace-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/SHANTE-Workspace-*.zip
            dist/SHANTE-Workspace-*.json
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cmake -S native -B native/build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSHANTE_SANITIZERS=ON
      - run: cmake --build native/build-sanitize --parallel 2
      - run: ctest --test-dir native/build-sanitize --output-on-failure
