name: Web application
on:
  pull_request:
    paths: ['web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate web SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx > web-dependencies.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dependency-sbom
          path: web-dependencies.cdx.json
          if-no-files-found: error
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - name: Install libarchive for encrypted ZIP interoperability
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm run test:web
      - run: npm run build
