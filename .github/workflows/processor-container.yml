name: Processor container
on:
  pull_request:
    paths: ['native/**', 'processor/**', 'web/**', 'package.json', 'package-lock.json', '.dockerignore', 'compose.local.yml', 'scripts/smoke-container.py', '.github/workflows/processor-container.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Poppler for independent PDF verification
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Start the local deployment
        run: docker compose -f compose.local.yml up --build --detach --wait --wait-timeout 60
      - name: Verify web assets and Zstandard jobs through the deployed service
        run: python3 scripts/smoke-container.py http://127.0.0.1:5010 --state "$RUNNER_TEMP/hamma-smoke.json"
      - name: Recreate the service with its existing volume
        run: docker compose -f compose.local.yml up --detach --force-recreate --wait --wait-timeout 60
      - name: Verify the download, retention and upload checkpoint after restart
        run: python3 scripts/smoke-container.py http://127.0.0.1:5010 --state "$RUNNER_TEMP/hamma-smoke.json" --after-restart
      - name: Record packages and runtimes from the running image
        run: |
          mkdir -p image-inventory
          docker compose -f compose.local.yml images --format json > image-inventory/images.json
          docker compose -f compose.local.yml exec -T hamma dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\n' > image-inventory/debian-packages.tsv
          docker compose -f compose.local.yml exec -T hamma python --version > image-inventory/python.txt
          docker compose -f compose.local.yml exec -T hamma /opt/shante/bin/shante-core probe > image-inventory/shante.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: processor-image-inventory
          path: image-inventory/
          if-no-files-found: error
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs
      - name: Remove the disposable deployment
        if: always()
        run: docker compose -f compose.local.yml down --volumes
