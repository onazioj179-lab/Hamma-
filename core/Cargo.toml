[package]
name = "spk-core"
version = "1.0.0"
edition = "2021"
authors = ["Singularity Pack Contributors"]
description = "Core compression engine for Singularity Pack - V1-V6"
license = "MIT"
keywords = ["compression", "archive", "streaming", "deduplication", "gpu"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["zstd-codec", "encryption", "recovery"]
zstd-codec = []
lz4-codec = []
brotli-codec = []
encryption = ["aes-gcm", "rand", "argon2"]
recovery = []
web = []
# V6 features
cuda = []
webgpu = []
rdma = []
cluster = []
# CLI feature
cli = ["clap", "indicatif", "console"]

[[bin]]
name = "spk"
path = "src/bin/spk.rs"
required-features = ["cli"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"

# Compression
zstd = "0.13"
lz4_flex = "0.11"
brotli = "3.4"

# Hashing & Integrity
sha2 = "0.10"
crc32fast = "1.3"
blake3 = "1.5"

# Encryption (V2)
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }

# Signature verification (V20)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Binary encoding
byteorder = "1.5"
bytes = "1.5"

# Async & Parallelism
tokio = { version = "1", features = ["full", "sync"] }
rayon = "1.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Utils
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
memmap2 = "0.9"
log = "0.4"
tracing = "0.1"

# File handling
tempfile = "3.9"
walkdir = "2.4"
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
hex = "0.4"
hostname = "0.3"
whoami = "1.4"
filetime = "0.2"

# V5 - Versioning/Delta
bincode = "1.3"

# V5 - Key derivation (encryption)
argon2 = { version = "0.5", optional = true }

# V6 - Performance
num_cpus = "1.16"

# 🔥 V24+ - Transport & Sharing
base64 = "0.21"
# CLI (optional)
clap = { version = "4.4", features = ["derive", "color"], optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }
[dev-dependencies]
criterion = "0.5"
tempfile = "3.9"
tokio-test = "0.4"
rand = "0.8"

[[bench]]
name = "pipeline_bench"
harness = false
